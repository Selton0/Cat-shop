<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat-shop</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="index.css" />
  </head>

  <div class="modal fade" id="modalExcluir" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirmar exclusão</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
          ></button>
        </div>
        <div class="modal-body">
          <p id="modalExcluirTexto"></p>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancelar
          </button>
          <button type="button" class="btn btn-danger" id="btnConfirmarExcluir">
            Confirmar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <body>
    <header class="bg-dark text-white p-3 mb-4 shadow-sm">
      <div class="container d-flex justify-content-between align-items-center">
        <h3 class="m-0">ᓚᘏᗢ Cat-Shop</h3>
        <nav class="menu">
          <a href="criar/criar.html" class="btn btn-warning btn-sm"
            >+ Adicionar Produto</a
          >
          <a href="../categorias/index.html" class="btn btn-info btn-sm"
            >& Categorias</a
          >
        </nav>
      </div>
    </header>

    <div class="container mb-3">
      <input id="busca" class="form-control" placeholder="Buscar produto..." />
    </div>

    <div class="container">
      <ul id="lista" class="list-group shadow-sm"></ul>
    </div>

    <div class="mt-3 d-flex justify-content-center gap-3">
      <button id="anterior" class="btn btn-secondary">Anterior</button>

      <span id="paginaInfo"></span>

      <button id="proximo" class="btn btn-secondary">Próximo</button>
    </div>

    <footer class="text-center bg-dark text-white p-3 mt-5">
      <span class="m-0">ᓚᘏᗢ A melhor Pet-shop para gatos do Brasil!!</span>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
