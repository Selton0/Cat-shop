<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Produto</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="criar.css">
  </head>

  <body>
    <header class="bg-dark text-white p-3 mb-4 shadow-sm">
      <div class="container d-flex justify-content-between align-items-center">
        <h3 class="m-0">ᓚᘏᗢ Cat-Shop</h3>
        <a href="../index.html" class="btn btn-warning btn-sm">Voltar</a>
      </div>
    </header>

    <main class="container">
      <div class="card shadow-sm p-4">
        <h2 class="mb-4">Adicionar Produto</h2>
        <form id="formProduto">
          <div class="mb-3">
            <label class="form-label">Nome do Produto</label>
            <input
              type="text"
              class="form-control"
              id="nome"
              placeholder="Digite o nome do produto"
            >
          </div>
          <div class="mb-3">
            <label class="form-label">Preço</label>
            <input
              type="number"
              class="form-control"
              id="preco"
              placeholder="Digite o preço"
            >
          </div>
          <button class="btn btn-success w-100">Salvar Produto</button>
        </form>
      </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="criar.js"></script>
  </body>
</html>
