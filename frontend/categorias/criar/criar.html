<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar Categoria</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>

  <div
    id="toastContainer"
    class="position-fixed top-0 end-0 p-3"
    style="z-index: 9999"
  ></div>
  <script src="../../toast.js"></script>
  <script src="../../config.js"></script>

  <body>
    <header class="bg-dark text-white p-3 mb-4 shadow-sm">
      <div class="container d-flex justify-content-between align-items-center">
        <h3 class="m-0">ᓚᘏᗢ Categorias</h3>
        <a href="../index.html" class="btn btn-warning btn-sm">Voltar</a>
      </div>
    </header>

    <main class="container">
      <div class="card shadow-sm p-4">
        <h2 class="mb-4">Nova Categoria</h2>

        <form id="formCategoria">
          <div class="mb-3">
            <label class="form-label">Nome da Categoria</label>

            <input
              type="text"
              class="form-control"
              id="nome"
              placeholder="Digite o nome da categoria"
            />
          </div>
          <button class="btn btn-success w-100">Criar Categoria</button>
        </form>
      </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="criar.js"></script>
  </body>
</html>
